    <main>
      <form class="form-contacto container">
        <h2>Solicitar cotización</h2>
        <div class="fila">
          <div class="campo">
            <label>Nombre</label>
            <input type="text" required />
          </div>
          <div class="campo">
            <label>Teléfono</label>
            <input type="tel" required />
          </div>
        </div>

        <div class="campo">
          <label>Correo</label>
          <input type="email" required />
        </div>

        <div class="campo">
          <label>Tipo de consulta</label>
          <select name="asunto">
            <option>Compra de vehículo</option>
            <option>Repuestos / Servicio</option>
            <option>Prueba de manejo</option>
            <option>Otra consulta</option>
          </select>
        </div>

        <div class="campo">
          <label>Marca y modelo de interés</label>
          <input type="text" placeholder="Ej: Ford Mustang 2024" />
        </div>

        <div class="campo">
          <label>Mensaje adicional</label>
          <textarea></textarea>
        </div>

        <button type="submit">Solicitar información</button>
      </form>
    </main>
